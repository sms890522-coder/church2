<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>은혜의빛교회</title>

<link href="https://cdn.jsdelivr.net/npm/pretendard/dist/web/static/pretendard.css" rel="stylesheet">

<style>
:root{
  --main:#7c3aed;
  --sub:#a78bfa;
  --bg:#f8fafc;
  --card:#ffffff;
  --text:#0f172a;
  --gray:#64748b;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard',sans-serif;}

body{
  background:var(--bg);
  color:var(--text);
}

/* HEADER */
header{
  position:fixed;
  width:100%;
  padding:16px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:1000;
  background:rgba(255,255,255,0.7);
  backdrop-filter:blur(12px);
}

nav a{
  margin-left:24px;
  text-decoration:none;
  color:var(--gray);
  font-weight:500;
  transition:.3s;
}

nav a.active,
nav a:hover{
  color:var(--main);
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:0 20px;
}

.hero h1{
  font-size:42px;
  line-height:1.3;
}

.hero span{
  color:var(--main);
}

/* BUTTON */
.btn{
  display:inline-block;
  margin-top:20px;
  padding:14px 20px;
  border-radius:12px;
  background:linear-gradient(135deg,var(--main),var(--sub));
  color:#fff;
  cursor:pointer;
  position:relative;
  overflow:hidden;
}

.btn::after{
  content:"";
  position:absolute;
  width:0;
  height:0;
  background:rgba(255,255,255,0.3);
  border-radius:50%;
  transform:translate(-50%,-50%);
  top:50%; left:50%;
  transition:0.5s;
}

.btn:active::after{
  width:300px;
  height:300px;
}

/* SECTION */
section{
  padding:120px 20px;
  max-width:1100px;
  margin:auto;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:20px;
}

/* CARD */
.card{
  background:var(--card);
  padding:24px;
  border-radius:20px;
  transition:.4s;
  cursor:pointer;
  border:1px solid rgba(0,0,0,0.05);
}

.card:hover{
  transform:translateY(-6px);
  box-shadow:0 20px 40px rgba(0,0,0,0.1);
}

.card.active{
  border:2px solid var(--main);
  transform:scale(1.03);
}

/* REVEAL */
.reveal{
  opacity:0;
  transform:translateY(40px);
  transition:1s;
}
.reveal.active{
  opacity:1;
  transform:translateY(0);
}

/* TOP BUTTON */
#topBtn{
  position:fixed;
  bottom:20px;
  right:20px;
  width:45px;
  height:45px;
  border-radius:50%;
  border:none;
  background:var(--main);
  color:#fff;
  display:none;
}

/* MOBILE */
@media(max-width:768px){
  .hero h1{font-size:28px;}
}
</style>
</head>

<body>

<header>
  <h3>은혜의빛교회</h3>
  <nav>
    <a href="#about">소개</a>
    <a href="#service">예배</a>
    <a href="#contact">오시는길</a>
  </nav>
</header>

<div class="hero">
  <div>
    <h1>삶을 변화시키는 <span>하나님의 은혜</span></h1>
    <a href="#about" class="btn">교회 알아보기</a>
  </div>
</div>

<section id="about" class="reveal">
  <h2>교회 소개</h2>
  <p style="color:var(--gray);margin-top:10px;">
    사랑과 말씀으로 세상을 섬기는 공동체입니다.
  </p>
</section>

<section id="service" class="reveal">
  <h2>예배 안내</h2>

  <div class="grid">
    <div class="card">주일 예배<br><small>오전 11시</small></div>
    <div class="card">수요 예배<br><small>오후 7시</small></div>
    <div class="card">새벽 기도<br><small>오전 5시</small></div>
  </div>
</section>

<section id="contact" class="reveal">
  <h2>오시는 길</h2>
  <p style="color:var(--gray)">서울 은평구 갈현로 93</p>

  <a href="https://naver.me/5bCRCHMm" target="_blank" class="btn">
    길찾기
  </a>
</section>

<button id="topBtn">↑</button>

<script>

// 부드러운 스크롤 (완전 안정형)
document.addEventListener("click", function(e){
  const link = e.target.closest("a");
  if(!link) return;

  const href = link.getAttribute("href");
  if(!href || !href.startsWith("#")) return;

  const target = document.querySelector(href);
  if(!target) return;

  e.preventDefault();

  const y = target.getBoundingClientRect().top + window.scrollY - 70;

  window.scrollTo({
    top:y,
    behavior:"smooth"
  });
});

// 카드 클릭 선택
document.querySelectorAll(".card").forEach(card=>{
  card.addEventListener("click",()=>{
    document.querySelectorAll(".card").forEach(c=>c.classList.remove("active"));
    card.classList.add("active");
  });
});

// 스크롤 reveal
function reveal(){
  document.querySelectorAll(".reveal").forEach(el=>{
    const top = el.getBoundingClientRect().top;
    if(top < window.innerHeight - 80){
      el.classList.add("active");
    }
  });
}
window.addEventListener("scroll", reveal);
window.addEventListener("load", reveal);

// top 버튼
const topBtn = document.getElementById("topBtn");

window.addEventListener("scroll",()=>{
  topBtn.style.display = window.scrollY > 300 ? "block" : "none";
});

topBtn.onclick = ()=>{
  window.scrollTo({top:0,behavior:"smooth"});
};

// nav active
const sections = document.querySelectorAll("section");
const links = document.querySelectorAll("nav a");

window.addEventListener("scroll",()=>{
  let current="";
  sections.forEach(sec=>{
    if(window.scrollY >= sec.offsetTop-100){
      current = sec.id;
    }
  });

  links.forEach(a=>{
    a.classList.remove("active");
    if(a.getAttribute("href") === "#"+current){
      a.classList.add("active");
    }
  });
});

</script>

</body>
</html>
