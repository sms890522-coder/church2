<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grace Light Church</title>

<link href="https://cdn.jsdelivr.net/npm/pretendard/dist/web/static/pretendard.css" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard',sans-serif;}

body{
  background:#f8fafc;
  color:#0f172a;
  overflow-x:hidden;
}

/* 헤더 */
header{
  position:fixed;
  width:100%;
  top:0;
  padding:18px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:999;
  background:rgba(255,255,255,0.7);
  backdrop-filter:blur(10px);
  transition:0.3s;
}

header.scrolled{
  box-shadow:0 5px 20px rgba(0,0,0,0.05);
}

nav a{
  margin-left:24px;
  text-decoration:none;
  color:#475569;
  position:relative;
}

/* 네비 hover 밑줄 애니메이션 */
nav a::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-4px;
  width:0%;
  height:2px;
  background:#6366f1;
  transition:0.3s;
}

nav a:hover::after{
  width:100%;
}

/* 히어로 */
.hero{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:
  linear-gradient(rgba(255,255,255,0.7),rgba(255,255,255,0.9)),
  url('https://images.unsplash.com/photo-1507692049790-de58290a4334') center/cover;
}

.hero h1{
  font-size:48px;
  line-height:1.2;
}

.hero p{
  margin-top:12px;
  color:#64748b;
}

/* 버튼 */
.btn{
  display:inline-block;
  margin-top:24px;
  padding:14px 22px;
  border-radius:12px;
  background:#6366f1;
  color:#fff;
  text-decoration:none;
  transition:0.3s;
}

.btn:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 25px rgba(99,102,241,0.3);
}

/* 섹션 */
section{
  padding:100px 20px;
  max-width:1100px;
  margin:auto;
}

h2{
  font-size:32px;
  margin-bottom:10px;
}

.desc{
  color:#64748b;
  margin-bottom:40px;
}

/* 카드 */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:20px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:26px;
  transition:0.3s;
  cursor:pointer;
  border:1px solid #e2e8f0;
  position:relative;
}

/* hover */
.card:hover{
  transform:translateY(-6px);
  box-shadow:0 15px 40px rgba(0,0,0,0.08);
}

/* 클릭 */
.card:active{
  transform:scale(0.97);
}

/* 선택 */
.card.active{
  border:1px solid #6366f1;
  box-shadow:0 0 0 3px rgba(99,102,241,0.2);
}

/* 은은한 빛 */
.card::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:18px;
  background:linear-gradient(120deg,transparent,rgba(99,102,241,0.1),transparent);
  opacity:0;
  transition:0.4s;
}

.card:hover::after{
  opacity:1;
}

/* 영상 */
.video{
  position:relative;
  padding-bottom:56.25%;
}

.video iframe{
  position:absolute;
  width:100%;
  height:100%;
  border-radius:14px;
}

/* 지도 */
.map iframe{
  width:100%;
  height:300px;
  border-radius:14px;
}

/* reveal */
.reveal{
  opacity:0;
  transform:translateY(40px);
  transition:0.8s;
}

.reveal.active{
  opacity:1;
  transform:translateY(0);
}

/* top 버튼 */
#topBtn{
  position:fixed;
  bottom:25px;
  right:20px;
  background:#6366f1;
  color:#fff;
  border:none;
  border-radius:50%;
  width:45px;
  height:45px;
  cursor:pointer;
  display:none;
}

/* 반응형 */
@media(max-width:768px){
  .hero h1{font-size:28px;}
  nav{display:none;}
}
</style>
</head>

<body>

<header id="header">
  <h3>Grace Light</h3>
  <nav>
    <a href="#about">소개</a>
    <a href="#service">예배</a>
    <a href="#media">영상</a>
    <a href="#location">오시는길</a>
  </nav>
</header>

<div class="hero">
  <div>
    <h1>빛으로 세상을 비추는 교회</h1>
    <p>당신을 환영합니다</p>
    <a href="#about" class="btn">교회 소개</a>
  </div>
</div>

<section id="about" class="reveal">
  <h2>교회 소개</h2>
  <p class="desc">사랑과 은혜로 함께하는 공동체</p>
</section>

<section id="service" class="reveal">
  <h2>예배 안내</h2>
  <div class="grid">
    <div class="card reveal">주일예배<br>오전 11시</div>
    <div class="card reveal">수요예배<br>오후 7시</div>
    <div class="card reveal">새벽기도<br>오전 5시</div>
  </div>
</section>

<section id="media" class="reveal">
  <h2>설교 영상</h2>
  <div class="video">
    <iframe src="https://www.youtube.com/embed/MYdZWLpebzQ" allowfullscreen></iframe>
  </div>
</section>

<section id="location" class="reveal">
  <h2>오시는 길</h2>
  <div class="map">
    <iframe src="https://maps.google.com/maps?q=seoul&t=&z=15&ie=UTF8&iwloc=&output=embed"></iframe>
  </div>
</section>

<button id="topBtn">↑</button>

<script>
/* 카드 선택 */
document.querySelectorAll(".card").forEach(card=>{
  card.addEventListener("click", ()=>{
    document.querySelectorAll(".card").forEach(c=>c.classList.remove("active"));
    card.classList.add("active");
  });
});

/* 스크롤 애니 */
function reveal(){
  document.querySelectorAll(".reveal").forEach(el=>{
    if(el.getBoundingClientRect().top < window.innerHeight - 80){
      el.classList.add("active");
    }
  });
}

window.addEventListener("scroll", reveal);
window.addEventListener("load", reveal);

/* 헤더 그림자 */
window.addEventListener("scroll",()=>{
  document.getElementById("header").classList.toggle("scrolled",window.scrollY>20);
});

/* 부드러운 이동 */
document.querySelectorAll('a[href^="#"]').forEach(link=>{
  link.addEventListener("click", function(e){
    const target = document.querySelector(this.getAttribute("href"));
    if(!target) return;
    e.preventDefault();
    window.scrollTo({
      top:target.offsetTop-60,
      behavior:"smooth"
    });
  });
});

/* top 버튼 */
const btn=document.getElementById("topBtn");
window.addEventListener("scroll",()=>{
  btn.style.display = window.scrollY>200 ? "block":"none";
});

btn.onclick=()=>{
  window.scrollTo({top:0,behavior:"smooth"});
};
</script>

</body>
</html>
