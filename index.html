<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Light Church</title>

<link href="https://cdn.jsdelivr.net/npm/pretendard/dist/web/static/pretendard.css" rel="stylesheet">

<style>
:root{
  --main:#6366f1;
  --bg:#020617;
  --text:#e5e7eb;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard',sans-serif;}

body{
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  position:relative;
}

.hero video{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0.4;
}

.hero-content{
  position:relative;
  z-index:2;
}

.hero h1{
  font-size:60px;
  font-weight:700;
}

.hero p{
  margin-top:15px;
  font-size:18px;
  color:#cbd5f5;
}

/* SCROLL SECTION */
.section{
  padding:140px 20px;
  max-width:1000px;
  margin:auto;
}

.section h2{
  font-size:36px;
  margin-bottom:20px;
}

.fade{
  opacity:0;
  transform:translateY(50px);
  transition:1s;
}

.fade.show{
  opacity:1;
  transform:translateY(0);
}

/* CARD */
.card{
  background:#111827;
  padding:30px;
  border-radius:20px;
  margin-top:20px;
  transition:0.3s;
}

.card:hover{
  transform:translateY(-10px) scale(1.02);
}

/* CTA */
.cta{
  height:60vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:linear-gradient(135deg,#6366f1,#22c55e);
}

.cta h2{
  font-size:40px;
}

/* BUTTON */
.btn{
  margin-top:20px;
  display:inline-block;
  padding:14px 22px;
  background:#fff;
  color:#000;
  border-radius:12px;
  text-decoration:none;
}

/* TOP */
#topBtn{
  position:fixed;
  bottom:20px;
  right:20px;
  width:45px;
  height:45px;
  border:none;
  border-radius:50%;
  background:#6366f1;
  color:#fff;
  display:none;
}
</style>
</head>

<body>

<div class="hero">
  <video autoplay muted loop>
    <source src="https://cdn.coverr.co/videos/coverr-aerial-view-of-a-church-5177/1080p.mp4" type="video/mp4">
  </video>
  <div class="hero-content">
    <h1>당신을 향한 하나님의 계획</h1>
    <p>이곳에서 시작됩니다</p>
  </div>
</div>

<div class="section fade">
  <h2>처음 오셨나요?</h2>
  <p>누구나 편하게 올 수 있는 교회입니다.</p>
</div>

<div class="section fade">
  <h2>예배 안내</h2>
  <div class="card">주일예배 오전 11시</div>
  <div class="card">수요예배 오후 7시</div>
</div>

<div class="section fade">
  <h2>설교 영상</h2>
  <div class="card">
    <iframe width="100%" height="300" src="https://www.youtube.com/embed/MYdZWLpebzQ"></iframe>
  </div>
</div>

<div class="cta">
  <div>
    <h2>이번 주, 한 번 와보세요</h2>
    <a href="https://naver.me/5bCRCHMm" class="btn">오시는 길</a>
  </div>
</div>

<button id="topBtn">↑</button>

<script>
// 애니메이션
const faders=document.querySelectorAll(".fade");
window.addEventListener("scroll",()=>{
  faders.forEach(el=>{
    if(el.getBoundingClientRect().top < window.innerHeight-100){
      el.classList.add("show");
    }
  });
});

// TOP
const topBtn=document.getElementById("topBtn");
window.addEventListener("scroll",()=>{
  topBtn.style.display=window.scrollY>200?"block":"none";
});
topBtn.onclick=()=>window.scrollTo({top:0,behavior:"smooth"});
</script>

</body>
</html>
