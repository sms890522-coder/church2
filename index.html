<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRACE CHURCH</title>

<link href="https://cdn.jsdelivr.net/npm/pretendard/dist/web/static/pretendard.css" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard',sans-serif;}

body{
  background:#0b0f19;
  color:#fff;
  line-height:1.6;
  overflow-x:hidden;
}

/* 헤더 */
header{
  position:fixed;
  width:100%;
  top:0;
  padding:18px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:999;
  backdrop-filter:blur(12px);
}

.logo{
  font-weight:700;
  letter-spacing:-0.5px;
}

nav a{
  margin-left:24px;
  color:#ccc;
  text-decoration:none;
  font-size:14px;
}

nav a:hover{color:#fff;}

/* 히어로 */
.hero{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:0 20px;
  background:
    linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.9)),
    url('https://images.unsplash.com/photo-1529070538774-1843cb3265df') center/cover;
}

.hero h1{
  font-size:48px;
  line-height:1.2;
}

.hero p{
  margin-top:16px;
  color:#aaa;
}

.btn{
  display:inline-block;
  margin-top:28px;
  padding:14px 20px;
  border-radius:10px;
  background:#4f46e5;
  color:#fff;
  text-decoration:none;
}

/* 섹션 */
section{
  padding:100px 20px;
  max-width:1100px;
  margin:auto;
}

h2{
  font-size:32px;
  margin-bottom:16px;
}

.desc{
  color:#aaa;
  margin-bottom:40px;
}

/* 카드 */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:20px;
}

.card{
  background:#111827;
  padding:24px;
  border-radius:16px;
  transition:0.3s;
}

.card:hover{
  transform:translateY(-6px);
}

/* 유튜브 */
.video{
  position:relative;
  padding-bottom:56.25%;
}

.video iframe{
  position:absolute;
  width:100%;
  height:100%;
  border-radius:12px;
}

/* 지도 */
.map iframe{
  width:100%;
  height:300px;
  border-radius:12px;
}

/* 푸터 */
footer{
  padding:60px 20px;
  text-align:center;
  color:#777;
}

/* 반응형 */
@media(max-width:768px){
  .hero h1{font-size:28px;}
  nav{display:none;}
}
</style>
</head>

<body>

<header>
  <div class="logo">GRACE CHURCH</div>
  <nav>
    <a href="#about">소개</a>
    <a href="#service">예배</a>
    <a href="#media">미디어</a>
    <a href="#location">오시는길</a>
  </nav>
</header>

<div class="hero">
  <div>
    <h1>하나님의 사랑이 흐르는 교회</h1>
    <p>당신을 환영합니다</p>
    <a href="#about" class="btn">교회 알아보기</a>
  </div>
</div>

<section id="about">
  <h2>교회 소개</h2>
  <p class="desc">우리는 예배와 사랑으로 세상을 섬깁니다.</p>
</section>

<section id="service">
  <h2>예배 안내</h2>
  <div class="grid">
    <div class="card">주일예배<br>오전 11시</div>
    <div class="card">수요예배<br>오후 7시</div>
    <div class="card">새벽기도<br>오전 5시</div>
  </div>
</section>

<section id="media">
  <h2>설교 영상</h2>
  <div class="video">
    <iframe src="https://www.youtube.com/embed/MYdZWLpebzQ" allowfullscreen></iframe>
  </div>
</section>

<section id="location">
  <h2>오시는 길</h2>
  <div class="map">
    <iframe src="https://maps.google.com/maps?q=seoul&t=&z=15&ie=UTF8&iwloc=&output=embed"></iframe>
  </div>
</section>

<footer>
  © 2026 GRACE CHURCH
</footer>

<script>
document.querySelectorAll('a[href^="#"]').forEach(link=>{
  link.addEventListener("click", function(e){
    const target = document.querySelector(this.getAttribute("href"));
    if(!target) return;
    e.preventDefault();
    window.scrollTo({
      top: target.offsetTop - 60,
      behavior: "smooth"
    });
  });
});
</script>

</body>
</html>
