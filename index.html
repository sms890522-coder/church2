<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>빛의교회</title>

<link href="https://cdn.jsdelivr.net/npm/pretendard/dist/web/static/pretendard.css" rel="stylesheet">

<style>
:root{
  --main:#4f46e5;
  --sub:#22c55e;
  --bg:#0f172a;
  --card:#1e293b;
  --text:#e2e8f0;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard',sans-serif;}

body{
  background:var(--bg);
  color:var(--text);
  scroll-behavior:smooth;
}

/* HEADER */
header{
  position:fixed;
  width:100%;
  top:0;
  display:flex;
  justify-content:space-between;
  padding:18px 30px;
  z-index:1000;
  backdrop-filter:blur(12px);
  background:rgba(15,23,42,0.7);
}

nav a{
  margin-left:20px;
  text-decoration:none;
  color:#cbd5f5;
  font-size:14px;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:
    radial-gradient(circle at 50% 30%, rgba(79,70,229,0.4), transparent 60%),
    linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.9)),
    url('https://images.unsplash.com/photo-1507692049790-de58290a4334') center/cover;
}

.hero h1{
  font-size:52px;
  line-height:1.3;
}

.hero p{
  margin-top:10px;
  color:#cbd5f5;
}

.btn{
  margin-top:25px;
  display:inline-block;
  padding:14px 22px;
  border-radius:12px;
  background:linear-gradient(135deg,#4f46e5,#6366f1);
  color:#fff;
  text-decoration:none;
  font-weight:500;
}

/* SECTION */
section{
  padding:120px 20px;
  max-width:1100px;
  margin:auto;
}

h2{
  font-size:32px;
  margin-bottom:20px;
}

.desc{
  color:#94a3b8;
  margin-bottom:40px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
}

/* CARD */
.card{
  background:var(--card);
  padding:25px;
  border-radius:18px;
  transition:0.3s;
  border:1px solid rgba(255,255,255,0.05);
}

.card:hover{
  transform:translateY(-6px);
  box-shadow:0 20px 40px rgba(0,0,0,0.4);
}

/* VIDEO */
.video{
  position:relative;
  padding-bottom:56.25%;
}
.video iframe{
  position:absolute;
  width:100%;
  height:100%;
  border-radius:14px;
}

/* MAP */
.map iframe{
  width:100%;
  height:320px;
  border-radius:14px;
}

/* CTA */
.cta{
  text-align:center;
  padding:120px 20px;
  background:linear-gradient(135deg,#4f46e5,#22c55e);
  border-radius:30px;
  margin-top:60px;
}

/* FOOTER */
footer{
  text-align:center;
  padding:50px;
  color:#64748b;
}

/* TOP */
#topBtn{
  position:fixed;
  bottom:25px;
  right:25px;
  width:45px;
  height:45px;
  border-radius:50%;
  border:none;
  background:#4f46e5;
  color:#fff;
  display:none;
}

/* MODAL */
#modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-box{
  background:#1e293b;
  padding:25px;
  border-radius:12px;
  width:90%;
  max-width:400px;
}
</style>
</head>

<body>

<header>
  <h3>빛의교회</h3>
  <nav>
    <a href="#about">소개</a>
    <a href="#service">예배</a>
    <a href="#youtube">말씀</a>
    <a href="#notice">공지</a>
    <a href="#location">오시는길</a>
  </nav>
</header>

<div class="hero">
  <div>
    <h1>당신을 향한 하나님의 빛</h1>
    <p>처음 오셔도 괜찮습니다</p>
    <a href="#about" class="btn">처음 방문하기</a>
  </div>
</div>

<section id="about">
  <h2>교회 소개</h2>
  <p class="desc">빛의교회는 예배와 사랑으로 사람을 세우는 공동체입니다.</p>
</section>

<section id="service">
  <h2>예배 안내</h2>
  <div class="grid">
    <div class="card"><h3>주일예배</h3><p>오전 11시</p></div>
    <div class="card"><h3>수요예배</h3><p>오후 7시</p></div>
    <div class="card"><h3>금요기도회</h3><p>오후 9시</p></div>
  </div>
</section>

<section id="youtube">
  <h2>설교 영상</h2>
  <div class="video">
    <iframe src="https://www.youtube.com/embed/MYdZWLpebzQ" allowfullscreen></iframe>
  </div>
</section>

<section id="notice">
  <h2>공지사항</h2>
  <div class="grid">
    <div class="card" onclick="openModal('부활절 예배','2026-04-20','특별 예배가 진행됩니다.')">
      <h3>부활절 예배</h3><p>2026-04-20</p>
    </div>
  </div>
</section>

<section id="location">
  <h2>오시는 길</h2>
  <div class="map">
    <iframe src="https://maps.google.com/maps?q=서울 은평구&t=&z=15&output=embed"></iframe>
  </div>
  <a href="https://naver.me/5bCRCHMm" target="_blank" class="btn">길찾기</a>
</section>

<div class="cta">
  <h2>처음 오신 분들을 환영합니다</h2>
  <p>누구나 편하게 올 수 있는 교회입니다</p>
</div>

<footer>© 2026 빛의교회</footer>

<button id="topBtn">↑</button>

<div id="modal">
  <div class="modal-box">
    <h3 id="mTitle"></h3>
    <p id="mDate"></p>
    <p id="mBody"></p>
  </div>
</div>

<script>
// 스크롤 이동
document.querySelectorAll('a[href^="#"]').forEach(link=>{
  link.addEventListener("click",e=>{
    e.preventDefault();
    const t=document.querySelector(link.getAttribute("href"));
    window.scrollTo({top:t.offsetTop-70,behavior:"smooth"});
  });
});

// TOP
const topBtn=document.getElementById("topBtn");
window.addEventListener("scroll",()=>{
  topBtn.style.display=window.scrollY>200?"block":"none";
});
topBtn.onclick=()=>window.scrollTo({top:0,behavior:"smooth"});

// MODAL
function openModal(t,d,c){
  modal.style.display="flex";
  mTitle.innerText=t;
  mDate.innerText=d;
  mBody.innerText=c;
}
window.onclick=e=>{
  if(e.target.id==="modal") modal.style.display="none";
};
</script>

</body>
</html>
