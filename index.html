<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grace Light Church</title>

<link href="https://cdn.jsdelivr.net/npm/pretendard/dist/web/static/pretendard.css" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard',sans-serif;}

body{
  background:#f8fafc;
  color:#0f172a;
  overflow-x:hidden;
}

/* progress */
#progress{
  position:fixed;
  top:0; left:0;
  height:3px;
  width:0%;
  background:#6366f1;
  z-index:9999;
}

/* header */
header{
  position:fixed;
  width:100%;
  top:0;
  padding:18px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:999;
  background:rgba(255,255,255,0.7);
  backdrop-filter:blur(10px);
  transition:0.3s;
}

header.scrolled{
  box-shadow:0 8px 25px rgba(0,0,0,0.05);
}

nav a{
  margin-left:24px;
  text-decoration:none;
  color:#475569;
  position:relative;
}

/* nav underline */
nav a::after{
  content:"";
  position:absolute;
  bottom:-4px; left:0;
  width:0%;
  height:2px;
  background:#6366f1;
  transition:0.3s;
}

nav a:hover::after,
nav a.active::after{
  width:100%;
}

/* hero */
.hero{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:
  linear-gradient(rgba(255,255,255,0.8),rgba(255,255,255,0.95)),
  url('https://images.unsplash.com/photo-1507692049790-de58290a4334') center/cover;
}

.hero h1{
  font-size:48px;
  line-height:1.2;
}

.hero p{
  color:#64748b;
  margin-top:10px;
}

.btn{
  display:inline-block;
  margin-top:20px;
  padding:14px 22px;
  border-radius:12px;
  background:#6366f1;
  color:#fff;
  text-decoration:none;
  transition:0.3s;
}

.btn:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 25px rgba(99,102,241,0.3);
}

/* section */
section{
  padding:100px 20px;
  max-width:1100px;
  margin:auto;
}

h2{font-size:32px;}
.desc{
  color:#64748b;
  margin:10px 0 40px;
}

/* cards */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:20px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:26px;
  cursor:pointer;
  border:1px solid #e2e8f0;
  transition:0.3s;
  position:relative;
}

.card:hover{
  transform:translateY(-6px);
  box-shadow:0 15px 40px rgba(0,0,0,0.08);
}

.card:active{
  transform:scale(0.97);
}

.card.active{
  border:1px solid #6366f1;
  box-shadow:0 0 0 3px rgba(99,102,241,0.2);
}

/* glow */
.card::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:18px;
  background:linear-gradient(120deg,transparent,rgba(99,102,241,0.1),transparent);
  opacity:0;
  transition:0.4s;
}

.card:hover::after{opacity:1;}

/* video */
.video{
  position:relative;
  padding-bottom:56.25%;
}
.video iframe{
  position:absolute;
  width:100%;
  height:100%;
  border-radius:14px;
}

/* map */
.map iframe{
  width:100%;
  height:300px;
  border-radius:14px;
}

/* reveal */
.reveal{
  opacity:0;
  transform:translateY(40px);
  transition:0.8s;
}
.reveal.active{
  opacity:1;
  transform:translateY(0);
}

/* top btn */
#topBtn{
  position:fixed;
  bottom:25px;
  right:20px;
  width:45px;
  height:45px;
  border:none;
  border-radius:50%;
  background:#6366f1;
  color:#fff;
  display:none;
  cursor:pointer;
}

/* mobile */
@media(max-width:768px){
  .hero h1{font-size:28px;}
  nav{display:none;}
}
</style>
</head>

<body>

<div id="progress"></div>

<header id="header">
  <h3>Grace Light</h3>
  <nav>
    <a href="#about">소개</a>
    <a href="#service">예배</a>
    <a href="#media">영상</a>
    <a href="#location">오시는길</a>
  </nav>
</header>

<div class="hero">
  <div>
    <h1>빛으로 세상을 비추는 교회</h1>
    <p>당신을 환영합니다</p>
    <a href="#about" class="btn">교회 소개</a>
  </div>
</div>

<section id="about" class="reveal">
  <h2>교회 소개</h2>
  <p class="desc">사랑과 은혜로 함께하는 공동체</p>
</section>

<section id="service" class="reveal">
  <h2>예배 안내</h2>
  <div class="grid">
    <div class="card">주일예배<br>오전 11시</div>
    <div class="card">수요예배<br>오후 7시</div>
    <div class="card">새벽기도<br>오전 5시</div>
  </div>
</section>

<section id="media" class="reveal">
  <h2>설교 영상</h2>
  <div class="video">
    <iframe src="https://www.youtube.com/embed/MYdZWLpebzQ" allowfullscreen></iframe>
  </div>
</section>

<section id="location" class="reveal">
  <h2>오시는 길</h2>
  <div class="map">
    <iframe src="https://maps.google.com/maps?q=seoul&t=&z=15&output=embed"></iframe>
  </div>
</section>

<button id="topBtn">↑</button>

<script>
/* 카드 선택 */
document.querySelectorAll(".card").forEach(card=>{
  card.addEventListener("click", ()=>{
    document.querySelectorAll(".card").forEach(c=>c.classList.remove("active"));
    card.classList.add("active");
  });
});

/* smooth scroll */
document.addEventListener("click", function(e){
  const link = e.target.closest('a');
  if(!link) return;

  const href = link.getAttribute("href");
  if(!href || !href.startsWith("#")) return;

  const target = document.querySelector(href);
  if(!target) return;

  e.preventDefault();

  window.scrollTo({
    top: target.offsetTop - 60,
    behavior: "smooth"
  });
});

/* reveal */
function reveal(){
  document.querySelectorAll(".reveal").forEach(el=>{
    if(el.getBoundingClientRect().top < window.innerHeight - 80){
      el.classList.add("active");
    }
  });
}
window.addEventListener("scroll", reveal);
window.addEventListener("load", reveal);

/* header shadow */
window.addEventListener("scroll",()=>{
  document.getElementById("header").classList.toggle("scrolled",window.scrollY>20);
});

/* progress */
window.addEventListener("scroll",()=>{
  const h = document.body.scrollHeight - window.innerHeight;
  const p = (window.scrollY / h) * 100;
  document.getElementById("progress").style.width = p + "%";
});

/* top btn */
const btn = document.getElementById("topBtn");
window.addEventListener("scroll",()=>{
  btn.style.display = window.scrollY > 200 ? "block" : "none";
});
btn.onclick=()=>window.scrollTo({top:0,behavior:"smooth"});

/* active nav */
const sections=document.querySelectorAll("section");
const links=document.querySelectorAll("nav a");

window.addEventListener("scroll",()=>{
  let current="";
  sections.forEach(sec=>{
    if(window.scrollY >= sec.offsetTop - 100){
      current=sec.id;
    }
  });
  links.forEach(a=>{
    a.classList.remove("active");
    if(a.getAttribute("href")==="#"+current){
      a.classList.add("active");
    }
  });
});
</script>

</body>
</html>
